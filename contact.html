<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlexUI</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>
    <div class="header">
        <div class="logo">
            <h2>Flex<span>UI</span></h2>
        </div>

        <div class="nav">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="products.html">Products</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </div>
    </div>

    <div class="container-3">
        <h2 class="section-title-center">HUBUNGI KAMI</h2>

    <!-- BOX UTAMA (PENGHUBUNG BENTUK KOTAK DENGAN BORDER PUTUS-PUTUS) -->
        <div class="contact-box">
            
            <!-- 1. INFO KONTAK (BAGIAN ATAS) -->
            <div class="contact-info">
                <h3>Hubungi Kami</h3>
                <p class="contact-desc">Ada pertanyaan atau butuh bantuan? Jangan ragu untuk menghubungi kami.</p>
                
                <div class="info-item">
                    <i class="fa-solid fa-envelope"></i>
                    <div>
                        <strong>Email:</strong>
                        <span>hello@flexboxpractice.dev</span>
                    </div>
                </div>

                <div class="info-item">
                    <i class="fa-solid fa-location-dot"></i>
                    <div>
                        <strong>Lokasi:</strong>
                        <span>Medan, Indonesia</span>
                    </div>
                </div>
            </div>

            <!-- 2. FORMULIR (BAGIAN BAWAH) -->
            <form class="contact-form">
                <div class="form-group">
                    <label for="nama">Nama</label>
                    <input type="text" id="nama" placeholder="Nama lengkap" required>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="email@contoh.com" required>
                </div>

                <div class="form-group">
                    <label for="pesan">Pesan</label>
                    <textarea id="pesan" rows="3" placeholder="Tulis pesanmu..." required></textarea>
                </div>

                <button type="submit" class="btn-submit">Kirim Pesan</button>
            </form>

        </div>
    </div>

    <div class="footer">
        <div class="copyright">
            <p>&copy; FlexUI 2026</p>
        </div>
        
        <div class="privacy-terms">
            <p>Privacy</p>
            <p>Terms</p>
        </div>
    </div>
</body>
</html>
